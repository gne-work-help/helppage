<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경상남도교육청 학교업무 도움자료</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      [#2 동적 색상 메모] data.js의 color로 조합되는 bg-{color}-100, text-{color}-600 등은
      이 Play CDN 버전에서 런타임 DOM 스캔으로 자동 생성되므로 별도 설정 없이 정상 동작한다.
      ※ Play CDN에는 safelist를 넣지 말 것 — 광범위 패턴이 초기화를 멈춰 페이지 로딩이 멈춘다.
        '빌드형 Tailwind'로 전환할 때만 tailwind.config.js에 아래를 넣으면 purge로 색이 사라지지 않는다:
        safelist: [{ pattern: /^(bg|text)-(red|violet|teal|pink|amber|lime|fuchsia|emerald|cyan|blue|slate|green|sky|rose|purple|orange|indigo)-(100|400|500|600)$/, variants: ['hover','group-hover'] }]
    -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Noto Sans KR 폰트를 기본 폰트로 설정 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 배경 래퍼 */
        .bg-nature-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            background: linear-gradient(180deg, #eaf5f0 0%, #f2f8f5 15%, #f7faf9 40%, #f4f9f6 70%, #eef6f1 100%);
        }
        .bg-nature-wrap > div, .bg-nature-wrap > svg {
            position: absolute;
        }
        /* 왼쪽 상단 산 장식 */
        .bg-mountain-left {
            top: 0; left: 0;
            width: 350px; height: 300px;
        }
        /* 오른쪽 상단 산 장식 */
        .bg-mountain-right {
            top: 0; right: 0;
            width: 300px; height: 280px;
        }
        /* 왼쪽 하단 장식 */
        .bg-bottom-left {
            bottom: 0; left: 0;
            width: 400px; height: 300px;
        }
        /* 오른쪽 하단 장식 */
        .bg-bottom-right {
            bottom: 0; right: 0;
            width: 380px; height: 280px;
        }
        /* 중간 좌측 장식 */
        .bg-mid-left {
            top: 40%; left: 0;
            width: 200px; height: 250px;
            transform: translateY(-50%);
        }
        /* 중간 우측 장식 */
        .bg-mid-right {
            top: 45%; right: 0;
            width: 180px; height: 220px;
            transform: translateY(-50%);
        }
        /* 학교 일러스트 */
        .school-illustration {
            position: absolute;
            top: 40px;
            right: 80px;
            width: 140px;
            height: 140px;
            z-index: 1;
            pointer-events: none;
        }
        @media (max-width: 768px) {
            .school-illustration {
                width: 90px; height: 90px;
                top: 20px; right: 20px;
            }
            .bg-mountain-left { width: 200px; height: 180px; }
            .bg-mountain-right { width: 180px; height: 160px; }
            .bg-bottom-left { width: 250px; height: 200px; }
            .bg-bottom-right { width: 230px; height: 180px; }
            .bg-mid-left { width: 120px; height: 160px; }
            .bg-mid-right { width: 110px; height: 140px; }
        }
        /* 카드 등장 애니메이션 */
        @keyframes cardEntrance {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            60% {
                opacity: 1;
                transform: translateY(-6px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .card-entrance {
            opacity: 0;
            animation: cardEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 스프링 바운스 슬라이드 애니메이션 */
        .slide-content {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transform: translateY(-8px);
            transition: grid-template-rows 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.3s ease,
                        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .slide-content > * {
            overflow: hidden;
        }
        .slide-content.open {
            grid-template-rows: 1fr;
            opacity: 1;
            transform: translateY(0);
            transition: grid-template-rows 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
                        opacity 0.4s ease 0.05s,
                        transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        /* 항목 줄: 한글은 단어 단위로 줄바꿈 (단어 중간에서 끊기지 않게) */
        .item-row .item-title { word-break: keep-all; overflow-wrap: anywhere; }
        .item-row .btn-group { display: flex; flex-shrink: 0; gap: 0.25rem; align-items: center; }
    </style>
</head>

    <header class="relative" style="z-index:2;">
        <div class="max-w-6xl mx-auto px-4 py-8">
            <h1 class="text-center text-3xl font-bold text-gray-800">경상남도교육청 학교업무 도움자료</h1>

                    id="global-search"
                    placeholder="전체 자료에서 검색 (초성도 가능 · 예: ㅇㅊㅇ)"

                    oninput="globalSearch()"
                    autocomplete="off"
                >
                <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <button
                    id="global-search-clear"
                    type="button"
                    onclick="clearGlobalSearch()"
                    class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors duration-150"
                    aria-label="검색어 지우기"

                </button>
            </div>
        </div>

        <!-- 통합 검색 결과 (검색 시에만 표시) -->
        <div id="global-results" class="hidden relative z-10"></div>

                    onclick="toggleSection('kindergarten')"
                    class="w-full p-6 text-left flex items-center justify-between hover:bg-gray-50 transition-colors duration-200 rounded-t-lg"
                >
                    <div class="flex items-center">
                        <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center mr-4">
                            <i class="fas fa-child text-blue-600 text-xl"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-gray-900">유치원</h3>
                            <p class="text-sm text-gray-600">유치원 관련 업무자료</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 transition-transform duration-200" id="kindergarten-arrow"></i>
                </button>
                
                <div id="kindergarten-content" class="slide-content rounded-b-lg">
                    <div>
                        <div class="border-t border-gray-100">
                            <div class="p-4 bg-gray-50">
                                <div class="relative">
                                    <input
                                        type="text"
                                        id="kindergarten-search"
                                        placeholder="원하는 업무를 검색해 보세요."
                                        class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
                                        oninput="searchSection('kindergarten')"
                                    >
                                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>

        : document.querySelector(`button[onclick="toggleSection('${sectionId}')"]`);

    if (!content.classList.contains('open')) {
        content.classList.add('open');
        if (arrow) arrow.style.transform = 'rotate(180deg)';
        if (button) { button.classList.remove('rounded-lg'); button.classList.add('rounded-t-lg'); }

        if (!sectionsRendered[sectionId]) {
            renderSections(sectionId);
            sectionsRendered[sectionId] = true;
        } else {
            replaySubSectionAnimations(sectionId);
        }
    } else {
        content.classList.remove('open');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
        if (button) { button.classList.remove('rounded-t-lg'); button.classList.add('rounded-lg'); }
    }
}

// ── 카테고리 내부 섹션 렌더 ──────────────────────────────────────────
function renderSections(prefix) {
    const container = document.getElementById(`${prefix}-sections`);
    if (!container) return;
    container.innerHTML = '';
    if (prefix === 'gyeongnam') { renderGyeongnam(container); return; }
    const strip = guideStripHTML(prefix);
    if (strip) container.insertAdjacentHTML('beforeend', strip);
    Object.entries(CATEGORY_DATA[prefix]).forEach(([sectionTitle, sectionData], index) => {
        container.appendChild(createDetailedSectionHTML(sectionTitle, sectionData, prefix, index));
    });
}

function createDetailedSectionHTML(title, data, typePrefix, index = 0) {
    const sectionElement = document.createElement('div');
    sectionElement.className = 'mb-4 border border-gray-200 rounded-lg overflow-hidden shadow-xs card-entrance';
    sectionElement.style.animationDelay = `${index * 60}ms`;

    const sectionId = makeSectionId(typePrefix, title);

    sectionElement.innerHTML = `
        <button
            onclick="toggleDetailedSubSection('${sectionId}')"
            class="w-full p-4 text-left flex items-center justify-between hover:bg-gray-100 transition-colors duration-200 bg-white"
        >
            <div class="flex items-center">
                <div class="w-8 h-8 bg-${data.color}-100 rounded-md flex items-center justify-center mr-3">
                    <i class="${data.icon} text-${data.color}-600 text-sm"></i>
                </div>
                <span class="font-medium text-gray-800">${escapeHtml(title)}</span>
            </div>
            <i class="fas fa-chevron-down text-gray-400 transition-transform duration-200" id="${sectionId}-arrow"></i>
        </button>

        <div id="${sectionId}-content" class="slide-content">
            <div>
                <div class="bg-gray-50 border-t border-gray-200">
                    ${HAS_AGENTS && sectionAgents[typePrefix] && sectionAgents[typePrefix][title]
                        ? `<div class="border-b border-gray-100">${agentBannerHTML(sectionAgents[typePrefix][title], sectionAgentName(sectionAgents[typePrefix][title]), sectionAgentName(sectionAgents[typePrefix][title]).replace(/ 통합 비서$/, '') + ' 업무 전체를 한 번에 물어볼 때')}</div>` : ''}
                    ${data.items.map(item => item.agent ? `
                        <div class="px-4 py-2 border-b border-gray-100 last:border-b-0">
                            <a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer"
                                title="${item.orig && item.orig !== item.title ? '사이트 이름: ' + escapeHtml(item.orig) : '경남GPT 비서와 대화하기'}"
                                class="flex items-center text-gray-700 hover:text-teal-700 hover:bg-white p-2 rounded-md transition-all duration-200 group">
                                <i class="fas fa-robot text-teal-500 mr-3 text-sm flex-shrink-0"></i>
                                <span class="item-title text-sm flex-grow">${escapeHtml(item.title)}</span>
                                <span class="text-xs text-teal-600 opacity-70 group-hover:opacity-100 whitespace-nowrap ml-2">대화하기 <i class="fas fa-arrow-right ml-0.5"></i></span>
                            </a>
                        </div>` : `
                        <div class="item-row pl-2 pr-2 sm:pr-3 py-1.5 border-b border-gray-100 last:border-b-0 flex items-center gap-1.5">
                            <a
                                href="${safeUrl(item.url)}"
                                target="_blank"
                                rel="noopener noreferrer"
                                title="웹하드 자료 폴더 열기"
                                class="flex items-center flex-grow min-w-0 text-gray-700 hover:text-${data.color}-600 hover:bg-white px-1 py-2 rounded-md transition-all duration-200 group"
                            >
                                <i class="fas fa-folder text-amber-400 mr-2 text-sm flex-shrink-0"></i>
                                <span class="item-title text-sm flex-grow">${escapeHtml(item.title)}</span>
                            </a>
                            <div class="btn-group">${agentButtonHTML(item.id, item.title)}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        </div>
    `;

    return sectionElement;
}

// ── 경남 특화비서(가로로 긴 카드): [길잡이][나만의 비서] → [탭 3개] → 고른 탭의 비서 목록 ──
let gyeongnamTab = '';
function renderGyeongnam(container) {
    const data = CATEGORY_DATA.gyeongnam || {};
    const a = guideTileHTML(globalGuide, 'fas fa-compass', 'AI 비서 길잡이', '어떤 비서를 활용할지 모르겠다면?', 'guide');
    const b = guideTileHTML(makeOwnAgent, 'fas fa-screwdriver-wrench', '나만의 비서 만들기', '내 업무에 맞는 비서를 직접 만들어요', 'agent');
    const tabs = Object.entries(data).map(([name, sec]) => {
        const on = name === gyeongnamTab;
        return `<button type="button" onclick="selectGyeongnamTab(this.dataset.tab)" data-tab="${escapeHtml(name)}" aria-expanded="${on}"
            class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg border text-sm font-semibold transition-colors duration-150 ${on
                ? 'bg-teal-600 border-teal-600 text-white'
                : 'bg-white border-gray-200 text-gray-700 hover:border-teal-400 hover:text-teal-700'}">
            <i class="${sec.icon}"></i><span>${escapeHtml(name)}</span><span class="text-xs font-medium ${on ? 'text-teal-100' : 'text-gray-400'}">${sec.items.length}</span>
            <i class="fas fa-chevron-down text-xs transition-transform duration-200 ${on ? 'rotate-180' : ''}"></i></button>`;
    }).join('');
    const sec = data[gyeongnamTab];
    const list = sec ? `<div class="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 card-entrance">${sec.items.map(it => `
        <a href="${safeUrl(it.url)}" target="_blank" rel="noopener noreferrer"
            title="${it.orig && it.orig !== it.title ? '사이트 이름: ' + escapeHtml(it.orig) : '경남GPT 비서와 대화하기'}"
            class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg border border-gray-200 bg-white hover:border-teal-400 hover:bg-teal-50 text-gray-700 hover:text-teal-800 transition-colors duration-150 group">
            <i class="fas fa-robot text-teal-500 text-sm flex-shrink-0"></i>
            <span class="text-sm flex-grow min-w-0">${escapeHtml(it.title)}</span>
            <i class="fas fa-arrow-right text-xs text-teal-500 opacity-50 group-hover:opacity-100 flex-shrink-0"></i>
        </a>`).join('')}</div>` : '';
    container.innerHTML = `
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${a}${b}</div>
        <div class="mt-3 grid grid-cols-1 sm:grid-cols-3 gap-2">${tabs}</div>
        ${list}`;
}
function selectGyeongnamTab(name) {
    gyeongnamTab = gyeongnamTab === name ? '' : name;   // 같은 탭을 다시 누르면 닫힘
    renderGyeongnam(document.getElementById('gyeongnam-sections'));
}

// ── 섹션 내부 하위 펼침/접힘 ─────────────────────────────────────────
function toggleDetailedSubSection(sectionId) {
    const content = document.getElementById(`${sectionId}-content`);
    const arrow = document.getElementById(`${sectionId}-arrow`);
    if (!content) return;

    if (!content.classList.contains('open')) {
        content.classList.add('open');
        if (arrow) arrow.style.transform = 'rotate(180deg)';
    } else {
        content.classList.remove('open');
        if (arrow) arrow.style.transform = 'rotate(0deg)';
    }
}

// ── 검색 (카테고리 공통) ─────────────────────────────────────────────
function searchSection(prefix) {
    const searchTerm = document.getElementById(`${prefix}-search`).value.toLowerCase();
    const container = document.getElementById(`${prefix}-sections`);
    searchDetailedItems(searchTerm, CATEGORY_DATA[prefix], container, prefix);
}

function searchDetailedItems(searchTerm, dataObject, containerElement, typePrefix) {
    // 검색어가 비면 전체를 다시 렌더하고 모두 접는다.
    if (!searchTerm.trim()) {
        containerElement.innerHTML = '';
        Object.entries(dataObject).forEach(([sectionTitle, sectionData], index) => {
            containerElement.appendChild(createDetailedSectionHTML(sectionTitle, sectionData, typePrefix, index));
        });
        setTimeout(() => {
            Object.keys(dataObject).forEach(sectionTitle => {
                const sectionId = makeSectionId(typePrefix, sectionTitle);
                const content = document.getElementById(`${sectionId}-content`);
                const arrow = document.getElementById(`${sectionId}-arrow`);
                if (content && content.classList.contains('open')) {
                    content.classList.remove('open');
                    if (arrow) arrow.style.transform = 'rotate(0deg)';
                }
            });
        }, 0);
        return;
    }

    // 제목/항목명에 검색어가 포함된 섹션만 추린다.
    const filteredData = {};
    Object.entries(dataObject).forEach(([sectionTitle, sectionData]) => {
        const matchingItems = sectionData.items.filter(item =>
            item.title.toLowerCase().includes(searchTerm) ||
            sectionTitle.toLowerCase().includes(searchTerm)
        );
        if (matchingItems.length > 0 || sectionTitle.toLowerCase().includes(searchTerm)) {
            filteredData[sectionTitle] = {
                ...sectionData,
                items: sectionTitle.toLowerCase().includes(searchTerm) && matchingItems.length === 0
                    ? sectionData.items
                    : matchingItems,
            };
        }
    });

    containerElement.innerHTML = '';
    if (Object.keys(filteredData).length === 0) {
        containerElement.innerHTML = `
            <div class="text-center py-8 text-gray-500">
                <i class="fas fa-search text-2xl mb-2"></i>
                <p>검색 결과가 없습니다.</p>
            </div>
        `;
        return;
    }

    // 일치한 섹션은 자동으로 펼친다.
    Object.entries(filteredData).forEach(([sectionTitle, sectionData], index) => {
        containerElement.appendChild(createDetailedSectionHTML(sectionTitle, sectionData, typePrefix, index));

        const sectionId = makeSectionId(typePrefix, sectionTitle);
        const sectionTitleMatches = sectionTitle.toLowerCase().includes(searchTerm);
        const itemsMatch = sectionData.items.some(item => item.title.toLowerCase().includes(searchTerm));

        if (sectionTitleMatches || itemsMatch) {
            setTimeout(() => {
                const content = document.getElementById(`${sectionId}-content`);
                const arrow = document.getElementById(`${sectionId}-arrow`);
                if (content && arrow) {
                    content.classList.add('open');
                    arrow.style.transform = 'rotate(180deg)';
                }
            }, 50);
        }
    });
}

// ── 하위 섹션 등장 애니메이션 재생 ───────────────────────────────────
function replaySubSectionAnimations(sectionId) {
    const container = document.getElementById(`${sectionId}-sections`);
    if (!container) return;
    container.querySelectorAll('.card-entrance').forEach((el, i) => {
        el.classList.remove('card-entrance');
        void el.offsetWidth; // 리플로우 강제 → 애니메이션 재시작
        el.style.animationDelay = `${i * 60}ms`;
        el.classList.add('card-entrance');
    });
}

// ── 통합·초성 검색 ───────────────────────────────────────────────────
const CHOSEONG = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

// 한글 음절의 초성만 뽑아 잇는다 (비한글은 그대로). 예: "유치원 규칙" → "ㅇㅊㅇ ㄱㅊ"
function toChoseong(str) {
    let out = '';
    for (const ch of str) {
        const code = ch.charCodeAt(0);
        if (code >= 0xAC00 && code <= 0xD7A3) {
            out += CHOSEONG[Math.floor((code - 0xAC00) / 588)];
        } else {
            out += ch;
        }
    }
    return out;
}

// 질의가 초성 자모(ㄱ~ㅎ)로만 이뤄졌는가
function isChoseongQuery(q) {
    return /[ㄱ-ㅎ]/.test(q) && /^[ㄱ-ㅎ\s]+$/.test(q);
}

// 텍스트가 검색어에 매칭되는가 — 초성 질의면 초성끼리, 아니면 일반 부분일치
function matchesQuery(text, query) {
    const q = query.trim();
    if (!q) return false;
    if (isChoseongQuery(q)) {
        return toChoseong(text).replace(/\s/g, '').includes(q.replace(/\s/g, ''));
    }
    return text.toLowerCase().includes(q.toLowerCase());
}

// 검색어를 한 번에 지우고 탐색 뷰로 복귀 (✕ 버튼)
function clearGlobalSearch() {
    const input = document.getElementById('global-search');
    if (!input) return;
    input.value = '';
    globalSearch();   // 결과 숨김 + 탐색 뷰 복귀 + ✕ 버튼 숨김
    input.focus();
}

// 검색 결과 필터 ('all' 전체 / 'folder' 폴더 / 'file' 파일)
let searchFilter = 'all';
function setSearchFilter(f) {
    searchFilter = f;
    globalSearch();
}

// 전체 카테고리(폴더 + 폴더 안 파일)를 한 번에 검색 → 결과 패널 렌더, 카테고리 탐색 뷰는 숨김
function globalSearch() {
    const input = document.getElementById('global-search');
    const browse = document.getElementById('browse-view');
    const results = document.getElementById('global-results');
    if (!input || !browse || !results) return;

    const term = input.value.trim();

    // 검색어 지우기(✕) 버튼: 입력값이 있을 때만 표시
    const clearBtn = document.getElementById('global-search-clear');
    if (clearBtn) clearBtn.classList.toggle('hidden', input.value.length === 0);

    // 검색어가 비면 탐색 뷰 복귀
    if (!term) {
        results.classList.add('hidden');
        results.innerHTML = '';
        browse.classList.remove('hidden');
        return;
    }

    browse.classList.add('hidden');
    results.classList.remove('hidden');

    // 카테고리별로 폴더 매칭 + 폴더 안 파일 매칭 수집
    const hasFiles = typeof filesData !== 'undefined';
    const groups = [];
    let folderTotal = 0, fileTotal = 0;
    for (const [prefix, data] of Object.entries(CATEGORY_DATA)) {
        const folderHits = [], fileHits = [];
        for (const [sectionTitle, section] of Object.entries(data)) {
            const sectionHit = matchesQuery(sectionTitle, term);
            for (const item of section.items) {
                if (sectionHit || matchesQuery(item.title, term) || (item.orig && matchesQuery(item.orig, term))) {
                    folderHits.push({ id: item.id, title: item.title, url: item.url, sectionTitle, color: section.color, agent: !!item.agent });
                }
                if (hasFiles) {
                    for (const fn of (filesData[item.id] || [])) {
                        if (matchesQuery(fn, term)) {
                            fileHits.push({ id: item.id, name: fn, folderTitle: item.title, url: item.url, color: section.color });
                        }
                    }
                }
            }
        }
        folderTotal += folderHits.length;
        fileTotal += fileHits.length;
        if (folderHits.length || fileHits.length) groups.push({ prefix, folderHits, fileHits });
    }

    groups.sort((a, b) => (b.prefix === 'gyeongnam') - (a.prefix === 'gyeongnam'));   // 경남 특화비서 결과를 맨 위로
    const total = folderTotal + fileTotal;
    if (!total) {
        results.innerHTML = `
            <div class="text-center py-16 text-gray-500">
                <i class="fas fa-search text-3xl mb-3"></i>
                <p>"${escapeHtml(term)}"에 대한 검색 결과가 없습니다.</p>
            </div>`;
        return;
    }

    // 폴더/파일 필터 바
    const filterBtn = (key, label, count) => {
        const active = searchFilter === key;
        return `<button type="button" onclick="setSearchFilter('${key}')"
            class="px-3 py-1.5 rounded-full text-sm font-medium transition-colors ${active
                ? 'bg-indigo-600 text-white'
                : 'bg-white text-gray-600 border border-gray-300 hover:bg-gray-50'}">${label} <span class="${active ? 'text-indigo-100' : 'text-gray-400'}">${count}</span></button>`;
    };
    const filterBar = `<div class="flex flex-wrap items-center gap-2 mb-4">
            ${filterBtn('all', '전체', total)}${filterBtn('folder', '폴더', folderTotal)}${filterBtn('file', '파일', fileTotal)}
        </div>`;

    const showFolders = searchFilter !== 'file';
    const showFiles = searchFilter !== 'folder';
    const FILE_CAP = 300;            // 파일 결과 과다 방지
    let filesRendered = 0;

    const groupsHtml = groups.map(({ prefix, folderHits, fileHits }) => {
        const meta = CATEGORY_META[prefix] || { label: prefix, icon: 'fas fa-folder', color: 'gray' };
        const rows = [];
        if (showFolders) {
            for (const h of folderHits) {
                if (h.agent) {
                    rows.push(`<a href="${safeUrl(h.url)}" target="_blank" rel="noopener noreferrer"
                        class="flex items-center px-4 py-2.5 hover:bg-teal-50 transition-colors duration-150 group">
                        <i class="fas fa-robot text-teal-500 mr-3 text-sm flex-shrink-0"></i>
                    <span class="item-title text-sm text-gray-800 font-medium flex-grow">${escapeHtml(h.title)}</span>
                        <span class="text-xs text-gray-400 mr-2 hidden sm:inline">비서 · ${escapeHtml(h.sectionTitle)}</span>
                        <span class="text-xs text-teal-600 whitespace-nowrap">대화하기 <i class="fas fa-arrow-right ml-0.5"></i></span>
                    </a>`);
                    continue;
                }
                rows.push(`<div class="item-row flex items-center gap-1.5 pr-2 sm:pr-3 hover:bg-${h.color}-50 transition-colors duration-150"><a href="${safeUrl(h.url)}" target="_blank" rel="noopener noreferrer"
                    class="flex items-center flex-grow min-w-0 pl-3 pr-1 py-2.5 group">
                    <i class="fas fa-folder text-amber-400 mr-2 text-sm flex-shrink-0"></i>
                    <span class="item-title text-sm text-gray-800 font-medium flex-grow">${escapeHtml(h.title)}</span>
                    <span class="text-xs text-gray-400 mr-2 hidden sm:inline">폴더 · ${escapeHtml(h.sectionTitle)}</span>
                </a><div class="btn-group">${agentButtonHTML(h.id, h.title)}</div></div>`);
            }
        }
        if (showFiles) {
            for (const h of fileHits) {
                if (filesRendered >= FILE_CAP) break;
                filesRendered++;
                rows.push(`<div class="item-row flex items-center gap-1.5 pr-2 sm:pr-3 hover:bg-${h.color}-50 transition-colors duration-150"><a href="${safeUrl(h.url)}" target="_blank" rel="noopener noreferrer"
                    class="flex items-center flex-grow min-w-0 pl-3 pr-1 py-2.5 group">
                    <i class="fas fa-file-alt text-gray-400 mr-2 text-sm flex-shrink-0"></i>
                    <span class="item-title text-sm text-gray-700 flex-grow">${escapeHtml(h.name)}</span>
                    <span class="text-xs text-gray-400 mr-2 hidden sm:inline">${escapeHtml(h.folderTitle)}</span>
                </a><div class="btn-group">${agentButtonHTML(h.id, h.folderTitle)}</div></div>`);
            }
        }
        if (!rows.length) return '';
        const cnt = (showFolders ? folderHits.length : 0) + (showFiles ? fileHits.length : 0);
        return `<div class="mb-6">
                <div class="flex items-center mb-2">
                    <span class="inline-flex items-center justify-center w-7 h-7 rounded-md bg-${meta.color}-100 mr-2">
                        <i class="${meta.icon} text-${meta.color}-600 text-sm"></i>
                    </span>
                    <span class="font-semibold text-gray-800">${escapeHtml(meta.label)}</span>
                    <span class="text-xs text-gray-400 ml-2">${cnt}건</span>
                </div>
                <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-100 overflow-hidden">${rows.join('')}</div>
            </div>`;
    }).join('');

    const capNote = (showFiles && fileTotal > FILE_CAP)
        ? `<p class="text-xs text-amber-600 mb-4">파일 결과가 많아 ${FILE_CAP}개까지만 표시합니다. 검색어를 더 구체적으로 입력해 보세요.</p>`
        : '';

    results.innerHTML =
        `<p class="text-sm text-gray-500 mb-3">전체 검색 결과 <b class="text-gray-700">${total}</b>건 <span class="text-gray-400">(폴더 ${folderTotal} · 파일 ${fileTotal})</span></p>` +
        filterBar + capNote + groupsHtml;
}


// ── 제목이 2번째 줄로 한두 글자만 넘어가면 자간을 줄여 한 줄로 맞춤 ──────────
(function () {
    const STEPS = ['-0.02em', '-0.04em', '-0.06em', '-0.075em'];
    function lineCount(el) {
        const lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
        return Math.round(el.getBoundingClientRect().height / lh);
    }
    function fitTitle(row) {
        const t = row.querySelector('.item-title');
        if (!t) return;
        const w = Math.round(row.getBoundingClientRect().width);
        if (!w || row.dataset.fitW == w) return;
        row.dataset.fitW = w;
        t.style.letterSpacing = '';
        if (lineCount(t) !== 2) return;
        for (const ls of STEPS) {
            t.style.letterSpacing = ls;
            if (lineCount(t) === 1) return;
        }
        t.style.letterSpacing = '';
    }
    if (!('ResizeObserver' in window)) return;
    const ro = new ResizeObserver(entries => { for (const e of entries) fitTitle(e.target); });
    const watch = root => {
        if (root.nodeType !== 1) return;
        if (root.classList.contains('item-row')) ro.observe(root);
        root.querySelectorAll && root.querySelectorAll('.item-row').forEach(r => ro.observe(r));
    };
    new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(watch)))
        .observe(document.body, { childList: true, subtree: true });
    watch(document.body);
})();
</script>
